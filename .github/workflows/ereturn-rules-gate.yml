name: eReturn Rules Engine fail-closed QA
on:
  pull_request:
    branches: [main, 'audit/ereturn-all-routes-responsive-bilingual-20261021']
  push:
    branches: [main, 'ws05/individual-consumer-contract-20261022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no lockfile in repository)
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
