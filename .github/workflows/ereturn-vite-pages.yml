name: eReturn Vite Pages Build and Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Legacy branch-published Pages currently starts an auto Jekyll deployment on each push.
  # Once that deploy finishes, re-publish compiled Vite assets so source HTML never wins.
  # This recovery trigger is harmless after Pages source is switched to GitHub Actions.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ereturn-pages
  cancel-in-progress: false
jobs:
  build:
    # Do not deploy on failed upstream Jekyll runs; main push/dispatch still work.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Compile Pages release
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - name: Validate generated assets and reject source-only publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit,unquote
          class Assets(HTMLParser):
              def __init__(self): super().__init__(); self.paths=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.paths.append(a['src'])
                  if tag=='link' and a.get('rel')=='stylesheet' and a.get('href','').startswith('/eReturn-V2/'): self.paths.append(a['href'])
          html=Path('dist/index.html').read_text()
          assert '/src/main.tsx' not in html, 'Uncompiled source referenced by deployment'
          parser=Assets(); parser.feed(html)
          assert any(x.endswith('.js') for x in parser.paths), 'No compiled JS'
          assert any(x.endswith('.css') for x in parser.paths), 'No compiled CSS'
          prefix='/eReturn-V2/'
          for url in parser.paths:
              path=urlsplit(url).path
              assert path.startswith(prefix), f'Asset escaped repository base: {path}'
              asset=Path('dist')/unquote(path.removeprefix(prefix))
              assert asset.is_file(), f'Missing asset: {asset}'
          assert not any(p.suffix=='.tsx' for p in Path('dist').rglob('*')), 'Source TSX shipped'
          print('PASS compiled Pages assets:',parser.paths)
          PY
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    # The legacy Jekyll job can be delayed by GitHub's environment queue for
    # more than the previous six-minute polling budget.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      # While the repository uses a legacy branch Pages source, a Jekyll job
      # deploys the uncompiled root index.html after each push. Publish only
      # AFTER that legacy deployment finishes; otherwise the blank page recurs.
      # In custom-workflow Pages mode, skip the wait entirely.
      - name: Wait for automatic Jekyll Pages publisher (legacy mode)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["GITHUB_SHA"]

          def github(path):
              request = Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=25) as response:
                  return json.load(response)

          site = github("pages")
          build_type = site.get("build_type")
          if build_type == "workflow":
              print("PASS: Pages uses the custom Actions publisher; no legacy wait")
          elif build_type == "legacy" or (not build_type and site.get("source")):
              for attempt in range(360):
                  runs = github("actions/runs?per_page=80").get("workflow_runs", [])
                  matching = [
                      run for run in runs
                      if run.get("name") == "pages build and deployment"
                      and run.get("head_sha") == target_sha
                      and run.get("event") == "dynamic"
                  ]
                  if matching and matching[0].get("status") == "completed":
                      result = matching[0].get("conclusion")
                      print(f"Legacy Jekyll run {matching[0]['id']} settled ({result}); Vite is final publisher")
                      break
                  print(f"Legacy Jekyll deployment not settled for {target_sha}; check {attempt + 1}/360")
                  time.sleep(10)
              else:
                  raise SystemExit("BLOCKED: matching legacy Jekyll deploy did not settle; refusing raced publication")
          else:
              raise SystemExit(f"BLOCKED: unrecognized Pages publisher mode: {build_type!r}")
          PY
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public Vite HTML and asset responses
        env:
          SITE_URL: https://shihab-tech04.github.io/eReturn-V2/
        run: |
          python3 - <<'PY'
          import os,time
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin,urlsplit
          class Assets(HTMLParser):
              def __init__(self): super().__init__(); self.paths=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.paths.append(a['src'])
                  if tag=='link' and a.get('rel')=='stylesheet' and a.get('href','').startswith('/eReturn-V2/'): self.paths.append(a['href'])
          site=os.environ['SITE_URL']
          def fetch(u):
              with urlopen(Request(u,headers={'User-Agent':'eReturn-V2-release-smoke/1.0','Cache-Control':'no-cache'}),timeout=20) as r:
                  return r.status,r.headers.get_content_type(),r.read()
          for attempt in range(12):
              try:
                  status,typ,body=fetch(site+'?release='+os.environ['GITHUB_SHA'])
                  assert status==200 and typ=='text/html',f'bad HTML {status} {typ}'
                  assert b'/src/main.tsx' not in body,'Pages still serving uncompiled source'
                  p=Assets();p.feed(body.decode())
                  assert any(z.endswith('.js') for z in p.paths),'compiled JS missing'
                  assert any(z.endswith('.css') for z in p.paths),'compiled CSS missing'
                  for a in p.paths:
                      assert urlsplit(a).path.startswith('/eReturn-V2/'),f'wrong base: {a}'
                      u=urljoin(site,a);code,mime,data=fetch(u)
                      assert code==200 and len(data)>50,f'missing live asset {u}'
                      assert mime in ('text/javascript','application/javascript','text/css'),f'bad MIME {u} {mime}'
                  print('PASS live Vite Pages assets:',p.paths)
                  break
              except Exception as err:
                  if attempt==11: raise
                  print('Pages propagation pending:',err)
                  time.sleep(10)
          PY
