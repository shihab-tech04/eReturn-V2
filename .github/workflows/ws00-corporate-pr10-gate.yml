name: WS00 independent corporate PR10 tests
on:
  push:
    branches: ['ws00/corporate-pr10-tests-20261022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Run existing canonical unit suite
        run: npm run test
      - name: Independently execute original WS06 corporate suite and WS00 negative tests
        run: npx tsx --test src/tests/ws00CorporatePr10Gate.test.ts
      - run: npm run build
